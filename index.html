<!DOCTYPE html>
<html>
<head>
  <title>Union Pines Band Countdown</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #90D5FF;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 18px;
      margin-top: 5px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .countdowns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      color: #111;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.12);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .icon {
      font-size: 42px;
    }

    .type {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: 5px;
    }

    .event-name {
      font-size: 27px;
      font-weight: 900;
      margin: 8px 0;
    }

    .date {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }

    .timer {
      font-size: 34px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .days {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.8;
    }

    @media (max-width: 650px) {
      h1 {
        font-size: 36px;
      }

      .countdowns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>UNION PINES BAND</h1>
  <div class="subtitle">What's coming up?</div>

  <div class="countdowns">

    <div class="card">
      <div class="icon">🏈</div>
      <div class="type">Next Game</div>
      <div class="event-name" id="gameName">Loading...</div>
      <div class="date" id="gameDate"></div>
      <div class="timer" id="gameTimer"></div>
      <div class="days" id="gameDays"></div>
    </div>

    <div class="card">
      <div class="icon">🥁</div>
      <div class="type">Next Competition</div>
      <div class="event-name" id="compName">Loading...</div>
      <div class="date" id="compDate"></div>
      <div class="timer" id="compTimer"></div>
      <div class="days" id="compDays"></div>
    </div>

    <div class="card">
      <div class="icon">🎺</div>
      <div class="type">Next Practice</div>
      <div class="event-name" id="practiceName">Loading...</div>
      <div class="date" id="practiceDate"></div>
      <div class="timer" id="practiceTimer"></div>
      <div class="days" id="practiceDays"></div>
    </div>

    <div class="card">
      <div class="icon">🎉</div>
      <div class="type">Next Parade</div>
      <div class="event-name" id="paradeName">Loading...</div>
      <div class="date" id="paradeDate"></div>
      <div class="timer" id="paradeTimer"></div>
      <div class="days" id="paradeDays"></div>
    </div>

  </div>

  <div class="footer">
    Union Pines Marching Band • 2026 Season
  </div>

</div>


<script>

  // =========================
  // BAND DATES
  // =========================

  const events = {

    games: [
      "2026-09-18",
      "2026-09-25",
      "2026-10-09",
      "2026-10-23"
    ],

    comps: [
      "2026-09-26",
      "2026-10-03",
      "2026-10-17",
      "2026-10-24",
      "2026-10-31"
    ],

    practices: [
      "2026-09-08",
      "2026-09-09",
      "2026-09-14",
      "2026-09-15",
      "2026-09-21",
      "2026-09-22",
      "2026-09-28",
      "2026-09-29",
      "2026-10-05",
      "2026-10-06",
      "2026-10-12",
      "2026-10-13",
      "2026-10-19",
      "2026-10-20",
      "2026-10-26",
      "2026-10-27",
      "2026-11-02",
      "2026-11-03"
    ],

    parades: [
      "2026-11-07",
      "2026-12-05"
    ]

  };


  // =========================
  // SPECIAL EVENT NAMES
  // =========================

  const compNames = {
    "2026-10-24": "VIKING CLASSIC"
  };


  // =========================
  // FIND NEXT EVENT
  // =========================

  function getNextEvent(list) {

    const now = new Date();

    for (let date of list) {

      // Set event time to 12:00 PM
      const eventDate = new Date(date + "T12:00:00");

      if (eventDate > now) {
        return eventDate;
      }
    }

    return null;
  }


  // =========================
  // FORMAT DATE
  // =========================

  function formatDate(date) {

    return date.toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

  }


  // =========================
  // COUNTDOWN
  // =========================

  function updateCountdown(type, list, nameElement, dateElement, timerElement, daysElement) {

    const eventDate = getNextEvent(list);

    if (!eventDate) {

      nameElement.textContent = "Season complete";
      dateElement.textContent = "";
      timerElement.textContent = "🎉";
      daysElement.textContent = "";

      return;
    }


    // Event name

    if (type === "comp" && compNames[eventDate.toISOString().split("T")[0]]) {

      nameElement.textContent =
        compNames[eventDate.toISOString().split("T")[0]];

    } else {

      if (type === "game") {
        nameElement.textContent = "Football Game";
      }

      if (type === "comp") {
        nameElement.textContent = "Marching Competition";
      }

      if (type === "practice") {
        nameElement.textContent = "Band Practice";
      }

      if (type === "parade") {
        nameElement.textContent = "Parade";
      }

    }


    dateElement.textContent = formatDate(eventDate);


    const now = new Date();

    let difference = eventDate - now;

    if (difference < 0) {
      difference = 0;
    }


    const days = Math.floor(difference / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
      (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (difference / 1000) % 60
    );


    timerElement.textContent =
      String(days).padStart(2, "0") + "d " +
      String(hours).padStart(2, "0") + "h " +
      String(minutes).padStart(2, "0") + "m " +
      String(seconds).padStart(2, "0") + "s";


    if (days === 0) {
      daysElement.textContent = "TODAY!";
    } else if (days === 1) {
      daysElement.textContent = "1 day to go";
    } else {
      daysElement.textContent = days + " days to go";
    }

  }


  // =========================
  // UPDATE EVERYTHING
  // =========================

  function update() {

    updateCountdown(
      "game",
      events.games,
      document.getElementById("gameName"),
      document.getElementById("gameDate"),
      document.getElementById("gameTimer"),
      document.getElementById("gameDays")
    );


    updateCountdown(
      "comp",
      events.comps,
      document.getElementById("compName"),
      document.getElementById("compDate"),
      document.getElementById("compTimer"),
      document.getElementById("compDays")
    );


    updateCountdown(
      "practice",
      events.practices,
      document.getElementById("practiceName"),
      document.getElementById("practiceDate"),
      document.getElementById("practiceTimer"),
      document.getElementById("practiceDays")
    );


    updateCountdown(
      "parade",
      events.parades,
      document.getElementById("paradeName"),
      document.getElementById("paradeDate"),
      document.getElementById("paradeTimer"),
      document.getElementById("paradeDays")
    );

  }


  update();

  // Update every second
  setInterval(update, 1000);

</script>

</body>
</html>
